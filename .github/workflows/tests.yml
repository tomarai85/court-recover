name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 test/court-recover.test.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # severity=warning: style/info findings differ between shellcheck versions
      # (0.11 dropped SC2002, ubuntu's older build still reports it), so gating on
      # them makes the result depend on the runner image, not on the code.
      - run: shellcheck --severity=warning court-recover.sh
